[project]
name = "overstride"
version = "0.1.0"
description = "Injury-risk screening for runners from monocular video."
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.2.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    # Video decode for scripts/video_kinematics.py. The 2D pose detector is
    # torchvision's Keypoint R-CNN (BSD-3-Clause, already present via torch) --
    # mediapipe was tried first and its native library is blocked by this
    # machine's Smart App Control. See results/phase07.md.
    "opencv-python>=4.10",
    # Upper bound is a Windows Smart App Control constraint, not an API one:
    # pandas 3.0.5's tzconversion .pyd is blocked as unreputable on this machine.
    # Verified immaterial to results -- every phase 4 AUC was bit-identical
    # across 3.0.5 and 2.3.3. See results/phase04.md.
    "pandas>=2.2,<3",
    "pyarrow>=25.0.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100
