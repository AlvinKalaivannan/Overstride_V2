# CI for the measurement and demo track.
#
# Two jobs, deliberately separate. The vocabulary guard needs no dependencies
# at all, so it runs in seconds and cannot be broken by an install problem --
# `CLAUDE.md`'s rule that this track emits nothing about health is the one
# check that must never be skipped for an unrelated reason.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vocabulary-guard:
    name: vocabulary and output guard (M6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # stdlib only: no install step, nothing to fail but the guard itself
      - name: Check the demo surface and every committed report
        run: python scripts/check_vocabulary.py

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      # opencv-python links against libGL and libglib, which a runner image
      # does not carry. Without them `import cv2` raises during COLLECTION --
      # pytest exit code 2, not a test failure -- and every module touching
      # the video path goes with it. pyproject pins the non-headless build for
      # a documented Windows reason, so the libraries are installed here
      # rather than the dependency swapped.
      - name: Install the native libraries opencv-python links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0t64             || sudo apt-get install -y -qq libgl1 libglib2.0-0
      - name: Install
        run: uv sync --frozen
      # A separate, legible signal: an import failure here is unmistakable,
      # where the same failure inside pytest is just "exit code 2".
      - name: Check the imports that are not pure Python
        run: uv run python -c "import cv2, torch, scipy, numpy; print('cv2', cv2.__version__, '| torch', torch.__version__, '| scipy', scipy.__version__, '| numpy', numpy.__version__)"
      # Dataset-backed tests skip themselves when data/ is absent, which it
      # always is here: no dataset byte may enter this repository.
      - name: Run the suite
        run: uv run pytest -q -m "not slow" --tb=short -rf
